# Language
slang=en

# Video resumption
save-position-on-quit
resume-playback=yes

# Don't close window when video ends
keep-open=yes

# Better screenshots
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-template='~/Pictures/mpv/%F-%P'

# Better YouTube behavior
ytdl=yes

# Hardware decoding
hwdec=auto

# Remember subtitle/audio/video track selections
watch-later-options=aid,sid,vid,volume

# Better interpolation for low-FPS content
video-sync=display-resample
interpolation=yes

# History
save-watch-history=yes
