[[themes]]
name = "swamp light"
[themes.palette]
background = "#f1e3d1"
foreground = "#64513e"
black = "#64513e"
red = "#a73838"
green = "#8d8851"
yellow = "#d09700"
blue = "#9e5581"
magenta = "#bf7979"
cyan = "#75858c"
white = "#f1e3d1"
bright_black = "#8c7b68"
bright_red = "#a73838"
bright_green = "#8d8851"
bright_yellow = "#d09700"
bright_blue = "#9e5581"
bright_magenta = "#bf7979"
bright_cyan = "#75858c"
bright_white = "#DDCEBC"
[themes.component_style]
block_title = { fg = "Magenta" }
border = { fg = "BrightWhite" }

playback_status = { fg = "Cyan", modifiers = ["Bold"] }
playback_track = { fg = "Cyan", modifiers = ["Bold"] }
playback_artists = { fg = "Cyan", modifiers = ["Bold"] }
playback_album = { fg = "Yellow", modifiers = [] }
playback_metadata = { fg = "BrightBlack" }

playback_progress_bar = { bg = "BrightWhite", fg = "Green" } # bg = {type == line} ? White : BrightWhite
playback_progress_bar_unfilled = { bg = "White", fg = "BrightWhite" } # only works when bar's type is line

current_playing = { fg = "Yellow" }
page_desc = { fg = "Blue", modifiers = [] }

table_header = { fg = "Magenta" }
selection = { fg = "Yellow", modifiers = ["Italic", "Bold"] }

[[themes]]
name = "swamp dark"
[themes.palette]
background = "#242015"
foreground = "#ebe0bb"
black = "#242015"
red = "#a93b5c"
green = "#6f682c"
yellow = "#DB930D"
blue = "#91506C"
magenta = "#d45d67"
cyan = "#A8663C"
white = "#D2C3A4"
bright_black = "#3a3124"
bright_red = "#a93b5c"
bright_green = "#6f682c"
bright_yellow = "#DB930D"
bright_blue = "#91506C"
bright_magenta = "#d45d67"
bright_cyan = "#A8663C"
bright_white = "#ebe0bb"
[themes.component_style]
block_title = { fg = "BrightYellow" }
border = { fg = "BrightBlack" }

playback_status = { fg = "Cyan", modifiers = ["Bold"] }
playback_track = { fg = "Yellow", modifiers = ["Bold"] }
playback_artists = { fg = "Yellow", modifiers = ["Bold"] }
playback_album = { fg = "Magenta" }
playback_metadata = { fg = "White" }

playback_progress_bar = { bg = "Black", fg = "BrightMagenta" }
playback_progress_bar_unfilled = { bg = "Black", fg = "BrightBlack" }

current_playing = { fg = "Yellow" }
page_desc = { fg = "BrightRed" }

table_header = { fg = "Blue" }
selection = { modifiers = ["Reversed", "Bold"] }
